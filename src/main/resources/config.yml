# NexusVice configuration
#
# Every substance/alcohol display-name below is exactly what players see
# in item names and chat messages. Change any of them and reload (or
# restart) -- nothing in the plugin's code needs to change. The internal
# keys (fentinoli, xanaxel, etc.) are just lookup keys, not shown to
# players anywhere.

tick-interval-seconds: 5
decay-per-tick: 3.0

vomit:
  severe-chance: 0.3
  overdose-chance: 1.0
  cooldown-seconds: 30
  # small chunks flying out on a vomit trigger -- weighted list, duplicates make an entry more
  # common (three DIRT to one ROTTEN_FLESH here means it's dirt about 3/4 of the time)
  blocks: [DIRT, DIRT, DIRT, ROTTEN_FLESH]

blackout:
  alcohol-threshold: 90.0
  damage-per-pulse: 2.0
  pulse-interval-seconds: 5

combo:
  # depressant substances taken alongside alcohol accelerate faster than either alone
  depressant-alcohol-bonus-multiplier: 1.5

rehab:
  cooldown-hours: 24

