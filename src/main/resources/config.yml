# Specific drinkable products. Each one maps back to a base type above (same shared alcohol
# pool/effect curve either way) -- quality only scales how strong one drink of it is. Override
# dose-per-item here per-brand if you want a brand to break from its quality tier's default
# multiplier (bottom-shelf x0.75, standard x1.0, top-shelf x1.4 of the base type's dose-per-item).
